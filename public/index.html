<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f9faf7">
    <meta name="description" content="Explore typical MRT and walking times across Taipei.">
    <title>Subway Metric · Taipei</title>
    <link rel="stylesheet" href="./vendor/maplibre-gl.css">
    <link rel="stylesheet" href="./map.css">
    <script type="module" src="./src/app.js"></script>
  </head>
  <body>
    <main>
      <div id="map" aria-label="Interactive Taipei MRT travel time map"></div>

      <header class="identity" aria-label="Subway Metric, Taipei">
        <span class="identity-icon" aria-hidden="true"><i></i><i></i><i></i></span>
        <span><strong>Subway Metric</strong><span class="city">Taipei <span lang="zh-Hant">台北</span></span></span>
      </header>

      <section class="trip panel" aria-label="Trip details">
        <div class="trip-heading">
          <span class="mode"><span class="mode-dot"></span><span id="mode">Explore</span></span>
          <button id="clear" type="button" hidden>Clear pin <kbd>Esc</kbd></button>
        </div>
        <div id="origin-label" class="origin-label" hidden></div>
        <div id="trip-result" aria-live="off">
          <p id="prompt" class="prompt">Loading Taipei routes…</p>
          <div id="result" hidden>
            <div class="total"><span id="total"></span> <span class="minutes">min</span></div>
            <p id="destination" class="destination"></p>
            <dl id="breakdown" class="breakdown"></dl>
            <ol id="lines-used" class="lines-used"></ol>
          </div>
        </div>
      </section>

      <section class="legend panel" aria-label="Travel time scale">
        <div class="legend-heading">
          <strong>Travel time (min)</strong>
          <span>Typical weekday</span>
        </div>
        <div class="bands" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
        <div class="ticks" aria-label="0 to 60 minutes, then 60 or more">
          <span>0</span><span>10</span><span>20</span><span>30</span><span>40</span><span>50</span><span>60+</span>
        </div>
        <details class="credits">
          <summary>Data and estimates</summary>
          <p>Walk at 4.8 km/h on mapped streets and paths. Train waits, station access, and transfers are estimated.</p>
          <p><a href="./data-sources.html">Sources and licenses</a></p>
        </details>
      </section>
      <div id="map-status" role="status" hidden></div>
    </main>
  </body>
</html>
