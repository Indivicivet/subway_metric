name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/configure-pages@v5
      - run: python -m pip install -r requirements.txt
      - run: python scripts/build_city.py --all
      - run: npm ci
      - run: npm run benchmark
      - run: npm run benchmark -- london
      - run: npm run benchmark -- guangzhou
      - name: Check mainland metro bundles
        run: |
          for city in zhengzhou shanghai chongqing chengdu beijing qingdao shenzhen; do
            npm run benchmark -- "$city"
          done
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v5
        id: deployment
