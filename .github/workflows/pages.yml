name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/configure-pages@v5
      - run: python -m pip install -r requirements.txt
      - run: python scripts/build_city.py
      - name: Prepare a London OpenStreetMap extract
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends osmium-tool
          base=https://download.geofabrik.de/europe/united-kingdom/england
          for region in greater-london berkshire buckinghamshire essex hertfordshire kent surrey; do
            curl --fail --location --retry 2 "$base/$region-latest.osm.pbf" -o ".cache/$region.osm.pbf"
            osmium extract --bbox=-0.675,51.335,0.32,51.764 ".cache/$region.osm.pbf" -o ".cache/clip-$region.osm.pbf"
          done
          osmium merge .cache/clip-*.osm.pbf -o .cache/london.osm.pbf
      - run: python scripts/build_city.py --city london
      - run: npm ci
      - run: npm run benchmark
      - run: npm run benchmark -- london
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v5
        id: deployment
